<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7cc4ff" />
    <meta
      name="description"
      content="数字大陆：多邻国式初一数学闯关，先学有理数。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>数字大陆 · 初一数学</title>
  </head>
  <body>
    <div class="cloud cloud-1" aria-hidden="true"></div>
    <div class="cloud cloud-2" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>

    <div class="app landing">
      <header class="hud">
        <a class="hud-back" href="../" aria-label="返回游戏合集">←</a>
        <div class="hud-title">数字大陆</div>
        <div class="hud-spacer"></div>
        <div class="hud-stat hud-score" title="得分">
          <span class="hud-icon">⭐</span>
          <span id="landingScore">0</span>
        </div>
        <div class="hud-stat hud-coins" title="金币">
          <span class="hud-icon">🪙</span>
          <span id="landingCoins">0</span>
        </div>
      </header>

      <main class="landing-main">
        <section class="hero">
          <div class="mascot">🦊</div>
          <h1 class="hero-title">数字大陆</h1>
          <p class="tagline">多邻国式 · 初一数学闯关</p>
          <p class="hero-streak" id="landingStreak">🔥 连续打卡 0 天</p>
          <a class="btn-primary hero-cta" href="./play/">开始学习 · 第 1 课 认识负数</a>
        </section>

        <section class="path">
          <h2 class="path-title">学习路径</h2>
          <p class="path-note">数 → 式 → 方程 → 解决问题</p>

          <div class="units">
            <a class="unit unit-blue" href="./play/">
              <span class="unit-emoji">🔢</span>
              <span class="unit-name">数与运算</span>
              <span class="unit-sub">有理数 · 实数 · 运算</span>
              <span class="unit-go">第 1 课已开放 →</span>
            </a>
            <div class="unit unit-green locked">
              <span class="unit-emoji">🔤</span>
              <span class="unit-name">代数式</span>
              <span class="unit-sub">整式 · 合并同类项</span>
              <span class="unit-lock">即将开放</span>
            </div>
            <div class="unit unit-orange locked">
              <span class="unit-emoji">⚖️</span>
              <span class="unit-name">方程</span>
              <span class="unit-sub">一元一次方程 · 天平</span>
              <span class="unit-lock">即将开放</span>
            </div>
            <div class="unit unit-purple locked">
              <span class="unit-emoji">📐</span>
              <span class="unit-name">图形与几何</span>
              <span class="unit-sub">线段 · 角 · 相交线</span>
              <span class="unit-lock">即将开放</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/home.ts"></script>
  </body>
</html>
