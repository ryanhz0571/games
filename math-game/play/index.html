<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7cc4ff" />
    <style>
      html {
        background: #7cc4ff;
      }
    </style>
    <meta
      name="description"
      content="数字大陆 · 跑酷数学挑战：躲避障碍，答对题目甩开怪物。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../runner.css" />
    <title>数字大陆 · 跑酷数学挑战</title>
  </head>
  <body class="runner-body">
    <div class="app runner-app">
      <header class="hud">
        <a class="hud-back" href="../" aria-label="返回数字大陆">←</a>
        <div class="hud-world">WORLD <span>RUN</span></div>
        <div class="hud-stat hud-streak" title="连续打卡天数">
          <span class="hud-icon">🔥</span>
          <span id="streak">0</span>
        </div>
        <div class="hud-stat hud-hearts" title="生命值">
          <span class="hud-icon">❤️</span>
          <span id="hearts">5</span>
        </div>
        <div class="hud-spacer"></div>
        <div class="hud-stat hud-level" title="等级">
          <span class="hud-icon">🏅</span>
          <span id="level">Lv.1</span>
        </div>
        <div class="hud-stat hud-score" title="得分">
          <span class="hud-icon">⭐</span>
          <span id="xp">0</span>
        </div>
        <div class="hud-stat hud-coins" title="金币">
          <span class="hud-icon">🪙</span>
          <span id="gems">0</span>
        </div>
      </header>

      <div class="progress runner-progress" aria-hidden="true">
        <div class="progress-caption">
          <span>跑酷距离</span>
          <span id="distance">0 m</span>
        </div>
        <div id="dangerBar" class="progress-bar danger-bar"></div>
      </div>

      <main class="runner-stage">
        <canvas id="gameCanvas" aria-label="跑酷游戏画面"></canvas>
        <div id="nextQuestion" class="next-question">下一题 3 秒</div>
        <button id="jumpBtn" class="jump-btn" type="button" aria-label="跳跃">
          跳
        </button>
      </main>
    </div>

    <div id="questionModal" class="question-modal" hidden>
      <div class="question-card question-card-runner">
        <div class="question-meta">
          <span class="question-countdown" id="questionCountdown">12 秒</span>
        </div>
        <h2 id="questionPrompt" class="question-prompt"></h2>
        <div id="questionBody" class="question-body"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="overlay" class="overlay" hidden></div>

    <script type="module" src="../src/runner.ts"></script>
  </body>
</html>
